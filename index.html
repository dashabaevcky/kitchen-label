<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кухонная Маркировка РБ</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; background: #f4f4f9; padding: 20px; margin: 0; user-select: none; }
        h1 { text-align: center; color: #333; font-size: 22px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
        .tile { background: #fff; border: 2px solid #ddd; border-radius: 12px; padding: 20px; text-align: center; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .tile:active { transform: scale(0.95); background: #eef2ff; border-color: #4f46e5; }
        .loading { text-align: center; font-size: 18px; color: #666; margin-top: 50px; }
    </style>
</head>
<body>

    <h1 id="status-title">Загрузка базы полуфабрикатов...</h1>
    <div class="loading" id="loader">Пожалуйста, подождите...</div>
    <div class="grid" id="menu"></div>

    <script>
        // Ваш рабочий IP принтера в сети Gelato
        const PRINTER_IP = "192.168.1.5"; 
        
        // Ваша актуальная рабочая ссылка Google Apps Script
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzpBOj8NLlZtj1isAHPSv4ly0vEK3I-1Y_Ye9wj1hHBWsG-QZxDfcvyXhZ7InMov8ZCTA/exec"; 

        const menuContainer = document.getElementById('menu');
        const loader = document.getElementById('loader');
        const statusTitle = document.getElementById('status-title');

        if (WEB_APP_URL && WEB_APP_URL !== "") {
            fetch(WEB_APP_URL)
                .then(response => response.json())
                .then(products => {
                    loader.style.display = 'none';
                    statusTitle.innerText = 'Выберите полуфабрикат для печати';
                    
                    products.forEach(prod => {
                        const tile = document.createElement('div');
                        tile.className = 'tile';
                        tile.innerText = prod.name;
                        tile.onclick = () => generateAndPrint(prod);
                        menuContainer.appendChild(tile);
                    });
                })
                .catch(error => {
                    loader.innerText = "Ошибка загрузки базы данных. Проверьте деплой в Google.";
                    console.error("Ошибка:", error);
                });
        }

        function formatDate(date) {
            const d = String(date.getDate()).padStart(2, '0');
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const y = date.getFullYear();
            const h = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');
            return `${d}.${m}.${y} ${h}:${min}`;
        }

        // ПРАВИЛЬНАЯ ФУНКЦИЯ КОДИРОВАНИЯ КИРИЛЛИЦЫ В CP1251 ДЛЯ ПРИНТЕРОВ XPRINTER
        function convertToWin1251(text) {
            const buffer = new Uint8Array(text.length);
            for (let i = 0; i < text.length; i++) {
                const charCode = text.charCodeAt(i);
                if (charCode < 128) {
                    buffer[i] = charCode; // Английский текст, цифры и спецсимволы (\r, \n)
                } else if (charCode >= 0x0410 && charCode <= 0x044F) {
                    buffer[i] = charCode - 0x0350; // Русские буквы А-Я, а-я
                } else if (charCode === 0x0401) {
                    buffer[i] = 0xA8; // Буква Ё
                } else if (charCode === 0x0451) {
                    buffer[i] = 0xB8; // Буква ё
                } else {
                    buffer[i] = 63; // Символ "?" для неизвестных знаков
                }
            }
            return buffer;
        }

        function generateAndPrint(product) {
            const now = new Date();
            const exp = new Date(now.getTime() + (parseInt(product.hours) * 60 * 60 * 1000));
            
            const timeString = formatDate(now);
            const expString = formatDate(exp);

            // 1. Фиксация в Журнале Бракеража РБ (Google Таблица)
            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: product.name,
                    time: timeString,
                    hours: product.hours,
                    quality: "Доброкачественно",
                    status: "Разрешено"
                })
            });

            // 2. Исходная разметка оригинального стикера 58х40 мм
            // Координаты TEXT сдвинуты (40, X), чтобы текст встал ровно по центру и не вылетал за поля
            const tsplCommand = 
                `SIZE 58 mm, 40 mm\r\n` +
                `GAP 3 mm, 0 mm\r\n` +
                `DIRECTION 1\r\n` +
                `CLS\r\n` +
                `CODEPAGE 1251\r\n` + 
                `TEXT 40,40,"3",0,1,1,1,"${product.name}"\r\n` +
                `TEXT 40,140,"3",0,1,1,1,"Приготовлено: ${timeString}"\r\n` +
                `TEXT 40,220 silence,"3",0,1,1,1,"Годен до: ${expString}"\r\n` +
                `PRINT 1,1\r\n`;

            // Кодируем строку через нашу правильную функцию конвертации в CP1251
            const dataBuffer = convertToWin1251(tsplCommand);

            // 3. Отправка пакета напрямую на сетевой порт 9100 принтера через исходный WebSocket
            const ws = new WebSocket(`ws://${PRINTER_IP}:9100`);
            ws.binaryType = 'arraybuffer';
            
            ws.onopen = () => {
                ws.send(dataBuffer);
                ws.close();
            };
            
            ws.onerror = (err) => {
                alert("Ошибка связи с принтером Wi-Fi. Проверьте статус сети на iPhone.");
                console.error(err);
            };
        }
    </script>
</body>
</html>
