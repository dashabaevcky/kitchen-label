<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кухонная Маркировка РБ</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; background: #f4f4f9; padding: 20px; margin: 0; user-select: none; }
        h1 { text-align: center; color: #333; font-size: 22px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
        .tile { background: #fff; border: 2px solid #ddd; border-radius: 12px; padding: 20px; text-align: center; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .tile:active { transform: scale(0.95); background: #eef2ff; border-color: #4f46e5; }
        .loading { text-align: center; font-size: 18px; color: #666; margin-top: 50px; }
        
        /* Стили для генерации скрытого изображения */
        #canvas-container { position: absolute; left: -9999px; top: -9999px; }
    </style>
    <!-- Подключаем библиотеку html2canvas для превращения макета в картинку -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <h1 id="status-title">Загрузка базы полуфабрикатов...</h1>
    <div class="loading" id="loader">Пожалуйста, подождите...</div>
    <div class="grid" id="menu"></div>

    <!-- Невидимый контейнер для рендеринга этикетки 58х40мм -->
    <div id="canvas-container">
        <div id="sticker-template" style="width: 580px; height: 400px; padding: 30px; box-sizing: border-box; background: #fff; display: flex; flex-direction: column; justify-content: space-between; color: #000;">
            <div id="st-name" style="font-size: 38pt; font-weight: bold; text-align: center; word-wrap: break-word; line-height: 1.2;"></div>
            <div>
                <div id="st-time" style="font-size: 24pt; font-weight: normal; margin-bottom: 10px; text-align: left;"></div>
                <div id="st-exp" style="font-size: 26pt; font-weight: bold; text-align: left;"></div>
            </div>
        </div>
    </div>

    <script>
        // Ссылка на ваше веб-приложение Google Apps Script
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwACF0Qc752mux6TjD0TiHP3lPNpeYk4PURSGfVn6bE8Ez5Y0yB4Vgv8GKTi-SDYz0jNQ/exec"; 

        const menuContainer = document.getElementById('menu');
        const loader = document.getElementById('loader');
        const statusTitle = document.getElementById('status-title');

        if (WEB_APP_URL && WEB_APP_URL !== "") {
            fetch(WEB_APP_URL)
                .then(response => response.json())
                .then(products => {
                    loader.style.display = 'none';
                    statusTitle.innerText = 'Выберите полуфабрикат для печати';
                    
                    products.forEach(prod => {
                        const tile = document.createElement('div');
                        tile.className = 'tile';
                        tile.innerText = prod.name;
                        tile.onclick = () => generateAndPrint(prod);
                        menuContainer.appendChild(tile);
                    });
                })
                .catch(error => {
                    loader.innerText = "Ошибка загрузки базы данных. Проверьте деплой в Google.";
                    console.error("Ошибка:", error);
                });
        }

        function formatDate(date) {
            const d = String(date.getDate()).padStart(2, '0');
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const y = date.getFullYear();
            const h = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');
            return `${d}.${m}.${y} ${h}:${min}`;
        }

        function generateAndPrint(product) {
            const now = new Date();
            const exp = new Date(now.getTime() + (parseInt(product.hours) * 60 * 60 * 1000));
            
            const timeString = formatDate(now);
            const expString = formatDate(exp);

            // Заполняем скрытый макет для рендера картинки
            document.getElementById('st-name').innerText = product.name;
            document.getElementById('st-time').innerText = `Приготовлено: ${timeString}`;
            document.getElementById('st-exp').innerText = `Годен до: ${expString}`;

            // Фиксация в Журнале Бракеража РБ (Google Таблица)
            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: product.name,
                    time: timeString,
                    hours: product.hours,
                    quality: "Доброкачественно",
                    status: "Разрешено"
                })
            });

            // Превращаем макет в картинку и шлем в сторонний драйвер по IP
            html2canvas(document.getElementById('sticker-template'), { scale: 1 }).then(canvas => {
                const imgData = canvas.toDataURL('image/png').split(',')[1]; // Чистый Base64
                
                // ИСПРАВЛЕНО: Вызываем сторонний драйвер печати по IP через URL-схему (на примере утилиты PrinterSmart/IPPrint)
                // Драйвер подхватит картинку из ссылки и мгновенно выплюнет ее на IP:9100
                const ipPrintAppUrl = `printer-smart://print?source=base64&data=${encodeURIComponent(imgData)}&width=58&height=40`;
                
                window.location.href = ipPrintAppUrl;
            });
        }
    </script>
</body>
</html>
