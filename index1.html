<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кухонная Маркировка РБ</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; background: #f4f4f9; padding: 20px; margin: 0; user-select: none; }
        h1 { text-align: center; color: #333; font-size: 22px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
        .tile { background: #fff; border: 2px solid #ddd; border-radius: 12px; padding: 20px; text-align: center; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .tile:active { transform: scale(0.95); background: #eef2ff; border-color: #4f46e5; }
        .loading { text-align: center; font-size: 18px; color: #666; margin-top: 50px; }
    </style>
</head>
<body>

    <h1 id="status-title">Загрузка базы полуфабрикатов...</h1>
    <div class="loading" id="loader">Пожалуйста, подождите...</div>
    <div class="grid" id="menu"></div>

    <script>
        // Ваша актуальная рабочая ссылка Google Apps Script
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzvG7DkzezypAmyeL6NJS4O24aQjCK9I7QNaD0o5DHc-c9LMnCclmbKpsNHltao3hPEOQ/exec"; 

        const menuContainer = document.getElementById('menu');
        const loader = document.getElementById('loader');
        const statusTitle = document.getElementById('status-title');

        if (WEB_APP_URL && WEB_APP_URL !== "") {
            fetch(WEB_APP_URL)
                .then(response => response.json())
                .then(products => {
                    loader.style.display = 'none';
                    statusTitle.innerText = 'Выберите полуфабрикат для печати';
                    
                    products.forEach(prod => {
                        const tile = document.createElement('div');
                        tile.className = 'tile';
                        tile.innerText = prod.name;
                        tile.onclick = () => generateAndPrint(prod);
                        menuContainer.appendChild(tile);
                    });
                })
                .catch(error => {
                    loader.innerText = "Ошибка загрузки базы данных. Проверьте деплой в Google.";
                    console.error("Ошибка:", error);
                });
        }

        function formatDate(date) {
            const d = String(date.getDate()).padStart(2, '0');
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const y = date.getFullYear();
            const h = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');
            return `${d}.${m}.${y} ${h}:${min}`;
        }

        function generateAndPrint(product) {
            const now = new Date();
            const exp = new Date(now.getTime() + (parseInt(product.hours) * 60 * 60 * 1000));
            
            const timeString = formatDate(now);
            const expString = formatDate(exp);

            // 1. Фиксация в Журнале Бракеража РБ (Google Таблица)
            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: product.name,
                    time: timeString,
                    hours: product.hours,
                    quality: "Доброкачественно",
                    status: "Разрешено"
                })
            });

            // 2. ОТПРАВКА НА ПЕЧАТЬ ЧЕРЕЗ ДИАЛОГОВОЕ ОКНО БРАУЗЕРА
            // Создаем скрытое временное окно строго под размеры этикетки 58х40 мм
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                <head>
                    <title>Печать этикетки</title>
                    <style>
                        @page { 
                            size: 58mm 40mm; 
                            margin: 0; 
                        }
                        body { 
                            width: 58mm; 
                            height: 40mm; 
                            margin: 0; 
                            padding: 3mm; 
                            box-sizing: border-box; 
                            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; 
                            color: #000;
                            background: #fff;
                            display: flex;
                            flex-direction: column;
                            justify-content: center;
                            align-items: center;
                            text-align: center;
                        }
                        .name { 
                            font-size: 16px; 
                            font-weight: bold; 
                            line-height: 1.2;
                            margin-bottom: 6px;
                            width: 100%;
                            word-wrap: break-word;
                        }
                        .info { 
                            font-size: 11px; 
                            margin: 2px 0;
                            white-space: nowrap;
                        }
                        .bold-info {
                            font-size: 12px;
                            font-weight: bold;
                            margin-top: 2px;
                        }
                    </style>
                </head>
                <body>
                    <div class="name">${product.name}</div>
                    <div class="info">Приготовлено: ${timeString}</div>
                    <div class="info bold-info">Годен до: ${expString}</div>
                    <script>
                        window.onload = function() {
                            window.print();
                            setTimeout(function() { window.close(); }, 300);
                        };
                    <\/script>
                </body>
                </html>
            `);
            printWindow.document.close();
        }
    </script>
</body>
</html>
